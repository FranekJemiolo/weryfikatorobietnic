version: '3.8'

networks:
  weryfikator-net:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.9.2}
  networks:
    - weryfikator-net
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-weryfikator}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    PYTHONPATH: /opt/airflow
    DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-weryfikator}
    SEJM_API_BASE_URL: https://api.sejm.gov.pl/sejm
    DEFAULT_SEJM_TERM: 10
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - ./dags:/opt/airflow/dags:rw
    - ./src:/opt/airflow/src:rw
    - ./logs:/opt/airflow/logs:rw
    - ./plugins:/opt/airflow/plugins:rw
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # -------------------------------------------------------------
  # BAZA DANYCH POSTGRESQL Z ROZSZERZENIEM PGVECTOR
  # -------------------------------------------------------------
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: weryfikator_postgres
    networks:
      - weryfikator-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-weryfikator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-weryfikator}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # -------------------------------------------------------------
  # INICJALIZACJA AIRFLOW (MIGRACJE I KONTO ADMINA)
  # -------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: weryfikator_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins}
        airflow db migrate
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --firstname Admin \
          --lastname Weryfikator \
          --role Admin \
          --email admin@weryfikatorobietnic.local \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} || true
    restart: "no"

  # -------------------------------------------------------------
  # AIRFLOW WEBSERVER & SCHEDULER
  # -------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: weryfikator_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: weryfikator_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------
  # BACKEND FASTAPI (LOKALNE ŚRODOWISKO API)
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weryfikator_api
    networks:
      - weryfikator-net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-weryfikator}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 8000
    volumes:
      - ./src:/app/src:ro
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
