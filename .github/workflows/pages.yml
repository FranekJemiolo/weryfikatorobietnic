name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Wymagane uprawnienia dla GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tylko jeden deploy naraz
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build static export
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_EXPORT: "true"
          NEXT_OUTPUT: "export"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://weryfikator-api-placeholder.run.app' }}
          NEXT_PUBLIC_SITE_URL: "https://FranekJemiolo.github.io/weryfikatorobietnic"
        run: pnpm run build

      - name: Disable Jekyll processing
        run: touch ./frontend/out/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
