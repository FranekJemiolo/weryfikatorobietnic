[project]
name = "weryfikatorobietnic"
version = "0.1.0"
description = "Weryfikator Obietnic - bezstronny system analityczny rozliczania obietnic wyborczych i monitorowania prac legislacyjnych Sejmu RP"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Franek Jemiolo", email = "franekjemiolo@gmail.com"}
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "pyyaml>=6.0.3",
    "feedparser>=6.0.14",
    "pypdf>=6.19.0",
    "google-genai>=2.24.0",
    "sqlmodel>=0.0.42",
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
    "pgvector>=0.5.0",
    "pymupdf>=1.28.2",
    "instructor>=1.17.0",
    "typer>=0.27.2",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^alembic/versions/.*"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*", "dags.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "respx>=0.23.1",
    "types-pyyaml>=6.0.12.20260906",
]
